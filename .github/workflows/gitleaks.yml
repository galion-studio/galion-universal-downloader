# Secret scan on every push and pull request.
# Uses the open-source gitleaks binary. No license secret and no repository
# setting changes. Findings are redacted in the log.

name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "${archive}"
          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan git history
        run: "${RUNNER_TEMP}/gitleaks" detect --source . --redact --verbose --exit-code 1

  token-env:
    name: twitter bearer env contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require TWITTER_BEARER_TOKEN from the environment
        run: node tests/twitter-bearer.test.cjs
