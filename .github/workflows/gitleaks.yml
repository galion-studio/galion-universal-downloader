# Secret scan on every push and pull request.
# Uses the open-source gitleaks binary. No license secret and no repository
# setting changes. Findings are redacted in the log.

name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p "$HOME/bin"
          install -m 0755 gitleaks "$HOME/bin/gitleaks"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/gitleaks" version

      - name: Scan git history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  token-env:
    name: twitter bearer env contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Twitter bearer comes from the environment
        run: node tests/twitter-bearer.test.cjs
